name: Build & Deploy v2 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'v2-src/**'
      - 'index.html'
      - '.github/workflows/deploy-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: v2-src/pnpm-lock.yaml

      - name: Install dependencies (v2-src)
        working-directory: v2-src
        run: pnpm install --frozen-lockfile

      - name: Build Next.js v2 (static export)
        working-directory: v2-src
        run: pnpm build

      - name: Compose Pages site
        run: |
          set -e
          mkdir -p _site/v2
          # Legacy v1 site at root (intact)
          cp index.html _site/
          [ -f vercel.json ] && cp vercel.json _site/ || true
          # Next.js v2 build output mounted at /v2/
          cp -r v2-src/out/. _site/v2/
          # Disable Jekyll so _next assets are served as-is
          touch _site/.nojekyll
          touch _site/v2/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
